services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci
      # Switch to PostgreSQL before any Prisma commands
      cp prisma/schema.prisma prisma/schema.prisma.bak
      sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
      echo "Waiting for database to be ready..."
      sleep 10
      npx prisma generate
      npx prisma migrate deploy
      npm run build
      # Restore original schema for any post-build steps
      mv prisma/schema.prisma.bak prisma/schema.prisma
    startCommand: |
      sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
      node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
          envVarKey: POSTGRES_PRISMA_URL
      - key: POSTGRES_PRISMA_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      - key: POSTGRES_URL_NON_POOLING
        fromDatabase:
          name: rdvapp-db
          property: connectionString
          envVarKey: INTERNAL_DATABASE_URL
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: rdvapp-db
    plan: free
    postgresMajorVersion: 15
    ipAllowList:
      - source: 0.0.0.0/0
        description: Everywhere
