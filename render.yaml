services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      echo "Current directory: $PWD"
      npm ci --include=dev
      npm run build
      echo "Checking build output:"
      ls -la dist/
      echo "Copying dist to /opt/render/project/src/"
      cp -r dist /opt/render/project/src/
      echo "Verifying copied files:"
      ls -la /opt/render/project/src/dist/
      npx prisma generate
    startCommand: npm run start:server
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      - key: POSTGRES_PRISMA_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      - key: POSTGRES_URL_NON_POOLING
        fromDatabase:
          name: rdvapp-db
          property: connectionString
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      - key: BASE_URL
        fromService:
          type: web
          name: rdvapp
          property: host
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - rdvapp.example.com

  - type: redis
    name: rdvapp-cache
    plan: free
    maxmemoryPolicy: noeviction
    region: frankfurt
    ipAllowList: [] # Only allow internal connections
    maxmemoryMb: 100

databases:
  - name: rdvapp-db
    plan: free
    postgresMajorVersion: 15
    ipAllowList: [] # Only allow internal connections
