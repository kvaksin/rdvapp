services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci --include=dev
      # Use production schema for deployment
      cp prisma/schema.production.prisma prisma/schema.prisma
      echo "Generating Prisma Client..."
      npx prisma generate
      echo "Type checking..."
      npx tsc --noEmit
      echo "Building application..."
      NODE_ENV=development npm run build
      echo "Build completed, checking dist folder..."
      ls -la dist/
    startCommand: |
      echo "Running database migrations..."
      npx prisma migrate deploy
      echo "Starting server..."
      node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      # Main connection URL with connection pooling
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      # Direct connection for migrations
      - key: DIRECT_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: rdvapp-db
    plan: free
    postgresMajorVersion: 15
    ipAllowList: [] # Only allow internal connections
    databaseName: rdvapp
    user: rdvapp_user
