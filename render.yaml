services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci --include=dev
      npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VITE_API_URL
        value: /api
      - key: BASE_URL
        generateValue: true
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: rdvapp-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
