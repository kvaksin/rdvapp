services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci --include=dev
      cp prisma/schema.production.prisma prisma/schema.prisma
      npx prisma generate
      npm run build
    startCommand: |
      npx prisma migrate deploy
      node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-postgres
          property: connectionString

databases:
  - name: rdvapp-postgres
    databaseName: rdvapp
    region: frankfurt
    plan: free
    postgresMajorVersion: 15
    ipAllowList: []
