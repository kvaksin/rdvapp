services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci --include=dev
      mkdir -p dist
      npm run build
      ls -la dist
      npx prisma generate
    startCommand: |
      while ! nc -z $DATABASE_HOST $DATABASE_PORT; do
        echo "Waiting for PostgreSQL to be ready..."
        sleep 2
      done
      echo "PostgreSQL is ready!"
      npx prisma migrate deploy
      npm run start:server
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: rdvapp-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: rdvapp-db
          property: port
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      - key: BASE_URL
        fromService:
          type: web
          name: rdvapp
          property: host
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - rdvapp.example.com

  - type: redis
    name: rdvapp-cache
    plan: free
    maxmemoryPolicy: noeviction
    region: frankfurt
    ipAllowList: [] # Only allow internal connections
    maxmemoryMb: 100

databases:
  - name: rdvapp-db
    databaseName: rdvapp
    plan: free
    postgresMajorVersion: 15
    ipAllowList: []  # Only allow internal connections
    user: rdvapp_user  # Specify a custom username
