services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci --include=dev
      # Install PostgreSQL client for connection checking
      apt-get update && apt-get install -y postgresql-client
      
      # Wait for database to be ready
      until PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -c '\q'; do
        echo "Waiting for database connection..."
        sleep 5
      done
      
      # Prepare and build application
      cp prisma/schema.production.prisma prisma/schema.prisma
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-postgres
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: rdvapp-postgres
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: rdvapp-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: rdvapp-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: rdvapp-postgres
          property: password
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: rdvapp-postgres
    databaseName: rdvapp
    region: frankfurt
    plan: free
    postgresMajorVersion: 15
    ipAllowList: 
      - source: 0.0.0.0/0
        description: Temporarily allow all IPs during setup
