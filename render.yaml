services:
  - type: web
    name: rdvapp
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      npm ci
      # Use production schema for deployment
      cp prisma/schema.production.prisma prisma/schema.prisma
      echo "Installing PostgreSQL client..."
      apt-get update && apt-get install -y postgresql-client
      echo "Waiting for database to be ready..."
      until pg_isready -h $POSTGRES_HOST -p 5432; do
        echo "Database is not ready - waiting..."
        sleep 2
      done
      echo "Database is ready!"
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rdvapp-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: rdvapp-db
          property: host
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: rdvapp-db
    plan: free
    postgresMajorVersion: 15
    ipAllowList: [] # Only allow internal connections
